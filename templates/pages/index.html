{% extends 'layout.html' %}

{% block conteudo %}
<h1>Bem-vindo, {{ session['user_name'] }}</h1>

<h2>Lista de Usuários com Cadastro</h2>
<ul>
    {% for user in users %}
        <li>{{ user['nome'] }} - {{ user['email'] }} <a href="{{ url_for('edit', id=user['id']) }}">Editar</a></li>
    {% endfor %}
</ul>
{% endblock %}
